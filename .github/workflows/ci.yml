name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic google-genai openai pytest

      - name: AST parser check
        run: |
          python -c "import ast; ast.parse(open('pramana_test.py').read()); print('AST OK')"

      - name: Import check
        run: |
          python -c "import pramana_test; print('Import OK')"

      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory; skipping pytest."
          fi
