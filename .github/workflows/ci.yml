name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace (dev + topofuzz[full] + fuzzeval[stats,cache])
        # `uv sync` reads root pyproject.toml `[dependency-groups].dev`,
        # which already pulls langgraph. We additionally pull the heavy
        # extras so the runner (step 5+) has its deps available in CI.
        run: |
          uv sync --python ${{ matrix.python-version }} \
            --extra full --package topofuzz \
            --extra stats --extra cache --package fuzzeval

      - name: Run tests
        # pyproject.toml `[tool.pytest.ini_options]` points testpaths at
        # both packages, so a bare `pytest` here discovers all 168+ tests.
        run: uv run --python ${{ matrix.python-version }} pytest -ra
