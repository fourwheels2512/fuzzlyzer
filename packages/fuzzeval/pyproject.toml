[project]
name = "fuzzeval"
version = "0.1.0.dev0"
description = "Shared eval infrastructure for topofuzz and other multi-agent eval tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Kiran Nayudu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Verify-path-safe deps only (no LangGraph, no LLM SDKs, no numpy).
# Heavy deps live in extras so `topofuzz[verify]` stays ~15MB.
dependencies = [
    "cryptography>=42",
    "rfc8785>=0.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
stats = [
    "numpy>=1.26",
    "scipy>=1.13",
]
cache = [
    "diskcache>=5.6",
]

[project.urls]
Homepage = "https://github.com/kirannayudu/fuzzeval"
Repository = "https://github.com/kirannayudu/fuzzeval"
Issues = "https://github.com/kirannayudu/fuzzeval/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzeval"]
