[project]
name = "modelbrew-core"
version = "0.1.0.dev0"
description = "Shared infrastructure for topofuzz and pramana-eval"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Kiran Nayudu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Verify-path-safe deps only (no LangGraph, no LLM SDKs).
# Heavy stats deps (numpy, scipy) live in the [stats] extra.
dependencies = [
    "cryptography>=42",
    "rfc8785>=0.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
stats = [
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/topology-safety/modelbrew-core"
Repository = "https://github.com/topology-safety/modelbrew-core"
Issues = "https://github.com/topology-safety/modelbrew-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelbrew_core"]
