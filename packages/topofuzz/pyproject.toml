[project]
name = "topofuzz"
version = "1.0.0"
description = "topofuzz™: Topology Safety Fuzzer for multi-agent LLM systems"
readme = "README.md"
license = { text = "BUSL-1.1" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Kiran Nayudu" }]
keywords = ["langgraph", "llm", "evaluation", "multi-agent", "topology", "fuzzing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to 0.2.x — same major series as the v1.0 ship. v0.3 may
    # break the §17a contract; bump deliberately with a co-tested
    # fuzzeval release.
    "fuzzeval>=0.2,<0.3",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
    "rfc8785>=0.1",
    # Upper bound: Pydantic v3 may change field-emission order or tuple
    # serialization, both of which would shift `canonical_hash`. Bump
    # deliberately and re-bless the golden hash test together.
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# topofuzz[verify]: base install already covers the verify-only dependency set.
# Kept as an extras name for forward-compat and documentation.
verify = []

# topofuzz[pdf]: `topofuzz publish --pdf` artifact for buyer pitch / email.
# Playwright + Chromium are heavy (~250MB after `playwright install chromium`);
# kept off the base install so verify-only callers never pay for it.
pdf = [
    # Upper bound: Playwright 2.x may change ``page.pdf()`` kwarg
    # semantics (margin / display_header_footer / footer_template). Bump
    # deliberately and re-render the gallery PDFs together.
    "playwright>=1.40,<2",
    # pypdf merges the report.pdf + per-flip inspect_<eid>.pdf pages into
    # a single artifact. ~1 MB pure-Python; no native deps.
    "pypdf>=4",
]

# topofuzz[ui]: the 5th-grader-runnable web UI (python -m topofuzz ui).
# Pulled separately from `full` so users who only want the CLI don't drag
# in a web framework.
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

# topofuzz[full]: adds LLM SDKs, plotting, secrets/retry/logging. Pulls ~400MB.
# Stats (numpy+scipy) and cache (diskcache) come transitively via
# fuzzeval[stats,cache] so they aren't duplicated here.
full = [
    # MUST match the base `dependencies` pin above. v1.0.0 shipped this
    # as `>=0.1,<0.2` which is mutually-unsatisfiable with the base
    # `>=0.2,<0.3` and made `pip install topofuzz[full]==1.0.0` fail to
    # resolve. Disclosed in CHANGELOG [Unreleased] / known v1.0.0 limitations.
    "fuzzeval[stats,cache]>=0.2,<0.3",
    # Match the dev-group pin (root pyproject.toml). The adapter touches
    # `compiled.builder`, `BranchSpec.ends`, and the `xray=1` flatten
    # contract — all of which moved between LangGraph 0.x and 1.x.
    "langgraph>=1.0,<2",
    "litellm>=1.40",
    "anthropic>=0.34",
    "openai>=1.40",
    "google-genai>=0.3",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "keyring>=25",
    "tenacity>=8.4",
    "structlog>=24",
]

[project.scripts]
topofuzz = "topofuzz.cli:app"

[project.urls]
Homepage = "https://github.com/fourwheels2512/fuzzlyzer"
Repository = "https://github.com/fourwheels2512/fuzzlyzer"
Issues = "https://github.com/fourwheels2512/fuzzlyzer/issues"
Changelog = "https://github.com/fourwheels2512/fuzzlyzer/blob/main/packages/topofuzz/CHANGELOG.md"
Documentation = "https://github.com/fourwheels2512/fuzzlyzer/blob/main/packages/topofuzz/README.md"

[build-system]
# hatchling >= 1.27 implements the **finalized** PEP 639 `license-files`
# semantics (array of glob patterns). Earlier versions (1.5-1.25) shipped
# draft-spec behavior; 1.26 was a transitional release. Pinning at >=1.27
# is the safest floor that guarantees the `License-File` field lands in
# wheel metadata across every consumer's build environment (audit pass-2
# CR-B2 fix).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topofuzz"]
