[project]
name = "topofuzz"
# Soft launch as 0.5.0rc1; promote to 0.5.0 after smoke-test feedback per
# project_step12b_handoff.md's lockdown decisions (2026-05-13).
version = "0.5.0rc1"
description = "Topology Safety Fuzzer for multi-agent LLM systems"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kiran Nayudu" }]
keywords = ["langgraph", "llm", "evaluation", "multi-agent", "topology", "fuzzing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to 0.1.x — same major series. v0.2 may break the §17a contract.
    "fuzzeval>=0.1,<0.2",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
    "rfc8785>=0.1",
    # Upper bound: Pydantic v3 may change field-emission order or tuple
    # serialization, both of which would shift `canonical_hash`. Bump
    # deliberately and re-bless the golden hash test together.
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# topofuzz[verify]: base install already covers the verify-only dependency set.
# Kept as an extras name for forward-compat and documentation.
verify = []

# topofuzz[full]: adds LLM SDKs, plotting, secrets/retry/logging. Pulls ~400MB.
# Stats (numpy+scipy) and cache (diskcache) come transitively via
# fuzzeval[stats,cache] so they aren't duplicated here.
full = [
    "fuzzeval[stats,cache]>=0.1,<0.2",
    # Match the dev-group pin (root pyproject.toml). The adapter touches
    # `compiled.builder`, `BranchSpec.ends`, and the `xray=1` flatten
    # contract — all of which moved between LangGraph 0.x and 1.x.
    "langgraph>=1.0,<2",
    "litellm>=1.40",
    "anthropic>=0.34",
    "openai>=1.40",
    "google-genai>=0.3",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "keyring>=25",
    "tenacity>=8.4",
    "structlog>=24",
]

[project.scripts]
topofuzz = "topofuzz.cli:app"

[project.urls]
Homepage = "https://github.com/kirannayudu/topofuzz"
Repository = "https://github.com/kirannayudu/topofuzz"
Issues = "https://github.com/kirannayudu/topofuzz/issues"
Changelog = "https://github.com/kirannayudu/topofuzz/blob/main/packages/topofuzz/CHANGELOG.md"
Documentation = "https://github.com/kirannayudu/topofuzz/blob/main/packages/topofuzz/README.md"

[build-system]
# hatchling >= 1.27 implements the **finalized** PEP 639 `license-files`
# semantics (array of glob patterns). Earlier versions (1.5-1.25) shipped
# draft-spec behavior; 1.26 was a transitional release. Pinning at >=1.27
# is the safest floor that guarantees the `License-File` field lands in
# wheel metadata across every consumer's build environment (audit pass-2
# CR-B2 fix).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topofuzz"]
