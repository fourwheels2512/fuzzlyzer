[project]
name = "topofuzz"
version = "0.5.0.dev0"
description = "Topology Safety Fuzzer for multi-agent LLM systems (TSF v5+)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Kiran Nayudu" }]
keywords = ["langgraph", "llm", "evaluation", "multi-agent", "topology", "fuzzing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "modelbrew-core",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
    "rfc8785>=0.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# tsf[verify]: base install already covers the verify-only dependency set.
# Kept as an extras name for forward-compat and documentation.
verify = []

# tsf[full]: adds LLM SDKs, stats, matplotlib, caching, etc. Required for
# `topofuzz run` and `topofuzz report`. Pulls ~400MB.
full = [
    "langgraph>=0.2",
    "litellm>=1.40",
    "anthropic>=0.34",
    "openai>=1.40",
    "google-genai>=0.3",
    "scipy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "diskcache>=5.6",
    "keyring>=25",
    "tenacity>=8.4",
    "structlog>=24",
]

[project.scripts]
topofuzz = "topofuzz.cli:app"

[project.urls]
Homepage = "https://github.com/topology-safety/topofuzz"
Repository = "https://github.com/topology-safety/topofuzz"
Issues = "https://github.com/topology-safety/topofuzz/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topofuzz"]
