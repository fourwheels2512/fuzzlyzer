[tool.uv.workspace]
members = ["packages/topofuzz", "packages/fuzzeval"]

[tool.uv.sources]
fuzzeval = { workspace = true }
topofuzz = { workspace = true }

# Workspace-wide dev tooling. `uv sync` installs the `dev` group by default.
# numpy + diskcache are here (not just in fuzzeval extras) so the test suite
# always has them available without requiring `--extra` flags.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "numpy>=1.26",
    "diskcache>=5.6",
    # Required by topofuzz.adapter tests (Weekend 1 step 3). Pulls
    # langchain-core transitively (~50MB). Adapter itself lazy-imports
    # langgraph so topofuzz[verify] users don't need it at runtime. Upper bound
    # is pinned to <2 because the adapter touches private API surface
    # (`StateGraph._builder.branches`, `BranchSpec.ends`, the `xray=1`
    # flatten contract) that has shifted across major versions.
    "langgraph>=1.0,<2",
    # Required by topofuzz.report tests (Weekend 3 step 11). Both libs
    # live in topofuzz[full] for end-users; the dev group mirrors them
    # so the test suite exercises the report render path without an
    # extras dance. The cli.report subcommand lazy-imports them so
    # topofuzz[verify] users still don't pay the ~50 MB matplotlib cost
    # — test_import_guard.py pins that contract.
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["packages/fuzzeval/tests", "packages/topofuzz/tests"]
addopts = ["-ra", "--strict-markers"]
